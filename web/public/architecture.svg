<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Shipping document recovery architecture</title>
  <desc id="desc">The authenticated demo UI sends shipping JSON through a Python API to Service Bus. A Registry-backed .NET worker validates the record, creates safe HTML, renders a PDF with Chromium, and stores outputs in Blob Storage. Invalid records move to the dead-letter queue, where a Hosted Skill reads the canonical schema through Connector Namespace, repairs only approved formatting issues, and requeues the record.</desc>
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #203047 }
    .title { font-size: 30px; font-weight: 700 }
    .label { font-size: 18px; font-weight: 650 }
    .detail { font-size: 14px; fill: #617087 }
    .box { fill: #fff; stroke: #b9c9e6; stroke-width: 2 }
    .blue { fill: #edf3ff; stroke: #7fa2df }
    .green { fill: #eaf7f0; stroke: #76b892 }
    .amber { fill: #fff7e8; stroke: #d3a153 }
    .purple { fill: #f5efff; stroke: #a980d0 }
    .line { fill: none; stroke: #6988bd; stroke-width: 3; marker-end: url(#arrow) }
    .repair { fill: none; stroke: #9a6ac8; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#purpleArrow) }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#6988bd" stroke-width="2"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#9a6ac8" stroke-width="2"/></marker>
  </defs>
  <text class="title" x="48" y="52">Shipping document recovery</text>

  <rect class="box blue" x="50" y="120" width="210" height="110" rx="14"/>
  <text class="label" x="76" y="160">Static demo UI</text>
  <text class="detail" x="76" y="188">Valid / repairable JSON</text>
  <text class="detail" x="76" y="210">HTML and PDF inspection</text>

  <rect class="box blue" x="340" y="120" width="210" height="110" rx="14"/>
  <text class="label" x="366" y="160">Python API</text>
  <text class="detail" x="366" y="188">Authenticated submission</text>
  <text class="detail" x="366" y="210">Status and PDF proxy</text>

  <rect class="box" x="630" y="120" width="210" height="110" rx="14"/>
  <text class="label" x="656" y="160">Service Bus</text>
  <text class="detail" x="656" y="188">shipment-submissions</text>
  <text class="detail" x="656" y="210">Duplicate detection</text>

  <rect class="box blue" x="920" y="120" width="300" height="110" rx="14"/>
  <text class="label" x="946" y="160">.NET 10 document worker</text>
  <text class="detail" x="946" y="188">Strict validation + safe HTML</text>
  <text class="detail" x="946" y="210">PuppeteerSharp + Chromium</text>

  <rect class="box green" x="920" y="330" width="300" height="110" rx="14"/>
  <text class="label" x="946" y="370">Private Blob containers</text>
  <text class="detail" x="946" y="398">Canonical JSON + HTML + PDF</text>
  <text class="detail" x="946" y="420">Managed identity access</text>

  <rect class="box amber" x="630" y="500" width="210" height="100" rx="14"/>
  <text class="label" x="656" y="540">Service Bus DLQ</text>
  <text class="detail" x="656" y="568">Invalid format only</text>

  <rect class="box purple" x="340" y="490" width="210" height="120" rx="14"/>
  <text class="label" x="366" y="530">Hosted Skill</text>
  <text class="detail" x="366" y="558">Bounded normalization</text>
  <text class="detail" x="366" y="580">Requeue once</text>

  <rect class="box purple" x="50" y="490" width="210" height="120" rx="14"/>
  <text class="label" x="76" y="530">Foundry + connectors</text>
  <text class="detail" x="76" y="558">Read schema from Blob</text>
  <text class="detail" x="76" y="580">Send repaired message</text>

  <path class="line" d="M260 175h80"/>
  <path class="line" d="M550 175h80"/>
  <path class="line" d="M840 175h80"/>
  <path class="line" d="M1070 230v100"/>
  <path class="repair" d="M735 230v270"/>
  <path class="repair" d="M630 550h-80"/>
  <path class="repair" d="M340 550h-80"/>
  <path class="repair" d="M445 490V410H735V230"/>

  <text class="detail" x="643" y="292">Validation failure</text>
  <text class="detail" x="520" y="398">Repaired record returns to the same deterministic path</text>
</svg>
